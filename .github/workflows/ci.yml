name: CI

run-name: "${{ github.event_name == 'pull_request' && format('CI · PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('CI · push to {0} by {1}', github.ref_name, github.actor) }}"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, lint, type-check, unit/component/e2e tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test (unit)
        run: pnpm test:unit

      - name: Test (component)
        run: pnpm test:component

      - name: Build
        run: pnpm build-only

      - name: E2E
        run: pnpm test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
