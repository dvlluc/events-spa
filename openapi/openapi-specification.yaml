                    description:
                      type: string
                    startAt:
                      type: string
                      format: date-time
                    endAt:
                      type: string
                      format: date-time
                    durationMinutes:
                      type: integer
                    id:
                      type: string
                      format: utc-millisec
              example:
                - title: title 1
